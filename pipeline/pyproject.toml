[project]
name = "turnup-pipeline"
version = "0.1.0"
description = "Turn Up Scotland lane A: data pipeline (stdlib only at runtime)"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
