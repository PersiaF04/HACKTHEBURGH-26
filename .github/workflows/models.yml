name: Models (lane B)

on:
  pull_request:
    branches: [main]
    paths: ["models/**", ".github/workflows/models.yml"]
  push:
    branches: [main]
    paths: ["models/**", ".github/workflows/models.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lane B is standard library only (models/README.md), so only pytest is installed.
      # The guards skip the steps if models/ is not on the branch yet.
      - if: hashFiles('models/**') != ''
        run: python -m pip install "pytest>=8"
      - if: hashFiles('models/**') != ''
        run: python -m pytest -q models
