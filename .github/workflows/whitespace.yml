name: Whitespace pipeline

on:
  pull_request:
    branches: [main]
    paths: ["whitespace/**", ".github/workflows/whitespace.yml"]
  push:
    branches: [main]
    paths: ["whitespace/**", ".github/workflows/whitespace.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Whitespace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r whitespace/requirements.txt
      - run: python -m pytest -q whitespace
