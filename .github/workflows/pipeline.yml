name: Pipeline (lane A)

on:
  pull_request:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8"
      - run: python -m pytest -q
